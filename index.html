<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A chess board you move pieces on by hand, in 2D and 3D." />
    <title>Chess Board</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Cpath fill='%23eeeed2' d='M0 0h8v8H0z'/%3E%3Cpath fill='%23769656' d='M4 0h4v4H4zM0 4h4v4H0z'/%3E%3C/svg%3E" />
    <style><!--inline-css--></style>
    <style id="skin-2d"><!--skin-css--></style>
    <script type="module" src="/src/app/main.ts"></script>
  </head>
  <body>
    <div id="sprite"><!--sprite--></div>
    <main class="app">
      <div class="bar" role="toolbar" aria-label="Board controls">
        <button id="undo" class="tiny" disabled aria-label="Undo" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="redo" class="tiny" disabled aria-label="Redo" title="Redo (Ctrl+Shift+Z)">
          <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <span class="grow"></span>
 <select id="skin-picker" aria-label="Skin" hidden></select>
        <button id="view-toggle" class="label" aria-pressed="false" title="Switch to 3D view">3D</button>
        <button id="flip" aria-label="Rotate board" title="Rotate board">
          <svg viewBox="0 0 24 24"><path d="M7 4v16M7 4 3.5 7.5M7 4l3.5 3.5"/><path d="M17 20V4m0 16-3.5-3.5M17 20l3.5-3.5"/></svg>
        </button>
        <button id="reset" aria-label="Reset to start position" title="Reset to start position">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button id="drawer-toggle" aria-label="Piece drawer" title="Piece drawer" aria-expanded="false" aria-controls="drawer">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 14h4"/></svg>
        </button>
      </div>
      <div id="board" class="board" tabindex="0" role="application" aria-label="Chess board. Arrow keys move, Enter picks up and drops, Delete removes.">
        <!--board-->
      </div>
      <div id="board3d" class="board3d" tabindex="0" role="application" aria-label="3D chess board. Drag empty space to turn the camera. Arrow keys move, Enter picks up and drops, Delete removes." hidden></div>
      <div id="drawer" class="drawer" aria-label="Piece drawer" data-open="false"><!--drawer--></div>
      <p id="live" class="sr-only" aria-live="polite"></p>
    </main>
  </body>
</html>
